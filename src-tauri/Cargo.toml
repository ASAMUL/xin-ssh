[package]
name = "xin-ssh"
version = "0.1.0"
description = "Xin SSH: a modern SSH client that puts remote file management first"
authors = ["Tongxin Wang"]
license = "MIT"
repository = "https://github.com/ASAMUL/xin-ssh"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xin_ssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
# 跨平台恢复文件与目录时间，避免自行维护 Windows 目录句柄差异。
filetime = "0.2"
# 配置文件原子落盘：写临时文件 -> fsync -> 原子 rename（Windows 用 ReplaceFile 语义）
tempfile = "3"
russh = { version = "0.61.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.3.0"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
ring = "0.17.14"
tauri-plugin-clipboard-manager = "2.3.2"

[profile.release]
codegen-units = 4
lto = true
opt-level = 3
panic = "abort"
strip = true
